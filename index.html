<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SO(3) 1,000,000 Vector Point Cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

    if (!gl) {
      alert('WebGL not supported on this browser.');
    }

    // Shader sources
    const vsSource = `
      attribute vec3 aPosition;
      attribute vec3 aColor;
      uniform mat4 uMatrix;
      varying vec3 vColor;
      void main() {
        vColor = aColor;
        vec4 pos = uMatrix * vec4(aPosition, 1.0);
        gl_Position = pos;
        gl_PointSize = 1.0;
      }
    `;

    const fsSource = `
      precision mediump float;
      varying vec3 vColor;
      void main() {
        gl_FragColor = vec4(vColor, 1.0);
      }
    `;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    const vertShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
    const fragShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
    const program = gl.createProgram();
    gl.attachShader(program, vertShader);
    gl.attachShader(program, fragShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    // Generate 1,000,000 SO(3) uniform vector points on unit sphere
    const NUM_POINTS = 1000000;
    const positions = new Float32Array(NUM_POINTS * 3);
    const colors = new Float32Array(NUM_POINTS * 3);

    for (let i = 0; i < NUM_POINTS; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      
      const x = Math.sin(phi) * Math.cos(theta);
      const y = Math.sin(phi) * Math.sin(theta);
      const z = Math.cos(phi);

      positions[i * 3] = x * 0.8;
      positions[i * 3 + 1] = y * 0.8;
      positions[i * 3 + 2] = z * 0.8;

      colors[i * 3] = x * 0.5 + 0.5;
      colors[i * 3 + 1] = y * 0.5 + 0.5;
      colors[i * 3 + 2] = z * 0.5 + 0.5;
    }

    // Setup Buffers
    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
    const aPosLoc = gl.getAttribLocation(program, 'aPosition');
    gl.enableVertexAttribArray(aPosLoc);
    gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

    const colBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    const aColLoc = gl.getAttribLocation(program, 'aColor');
    gl.enableVertexAttribArray(aColLoc);
    gl.vertexAttribPointer(aColLoc, 3, gl.FLOAT, false, 0, 0);

    const uMatrixLoc = gl.getUniformLocation(program, 'uMatrix');

    // Matrix & Rotation State
    let rotX = 0, rotY = 0;
    let isDragging = false;
    let lastX = 0, lastY = 0;

    function resize() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    function startDrag(x, y) {
      isDragging = true;
      lastX = x;
      lastY = y;
    }

    function moveDrag(x, y) {
      if (!isDragging) return;
