<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false }) || canvas.getContext('experimental-webgl');

    if (!gl) {
      alert('WebGL unavailable.');
    }

    const vsSource = `
      precision highp float;
      attribute vec3 aPosition;
      attribute vec3 aColor;
      uniform mat4 uMatrix;
      varying vec3 vColor;
      void main() {
        vColor = aColor;
        gl_Position = uMatrix * vec4(aPosition, 1.0);
        gl_PointSize = 1.0;
      }
    `;

    const fsSource = `
      precision highp float;
      varying vec3 vColor;
      void main() {
        gl_FragColor = vec4(vColor, 1.0);
      }
    `;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    const TOTAL_POINTS = 1000000;
    const CHUNK_SIZE = 100000;
    let loadedPoints = 0;

    const positions = new Float32Array(TOTAL_POINTS * 3);
    const colors = new Float32Array(TOTAL_POINTS * 3);

    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions.byteLength, gl.DYNAMIC_DRAW);

    const colBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, colors.byteLength, gl.DYNAMIC_DRAW);

    function generateChunk() {
      if (loadedPoints >= TOTAL_POINTS) return;

      const end = Math.min(loadedPoints + CHUNK_SIZE, TOTAL_POINTS);
      for (let i = loadedPoints; i < end; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = Math.cbrt(Math.random());

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        positions[i * 3] = x * 0.6;
        positions[i * 3 + 1] = y * 0.6;
        positions[i * 3 + 2] = z * 0.6;

        colors[i * 3] = x * 0.5 + 0.5;
        colors[i * 3 + 1] = y * 0.5 + 0.5;
        colors[i * 3 + 2] = z * 0.5 + 0.5;
      }

      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.bufferSubData(gl.ARRAY_BUFFER, loadedPoints * 3 * 4, positions.subarray(loadedPoints * 3, end * 3));

      gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
      gl.bufferSubData(gl.ARRAY_BUFFER, loadedPoints * 3 * 4, colors.subarray(loadedPoints * 3, end * 3));

      loadedPoints = end;

      if (loadedPoints < TOTAL_POINTS) {
        setTimeout(generateChunk, 0);
      }
    }

    generateChunk();

    const aPosLoc = gl.getAttribLocation(program, 'aPosition');
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);

    gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

    const aColLoc = gl.getAttribLocation(program, 'aColor');
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
    gl.enableVertexAttribArray(aColLoc);
    gl.vertexAttribPointer(aColLoc, 3, gl.FLOAT, false, 0, 0);

    const uMatrixLoc = gl.getUniformLocation(program, 'uMatrix');

    let rotX = 0, rotY = 0, isDragging = false, lastX = 0, lastY = 0;

    function resize() {
      canvas.width = window.innerWidth * Math.min(window.devicePixelRatio, 2);
      canvas.height = window.innerHeight * Math.min(window.devicePixelRatio, 2);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    function startDrag(x, y) { isDragging = true; lastX = x; lastY = y; }
    function moveDrag(x, y) {
      if (!isDragging) return;
      rotY += (x - lastX) * 0.005;
      rotX += (y - lastY) * 0.005;
      lastX = x;
      lastY = y;
    }
    function endDrag() { isDragging = false; }

    canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchmove', e => {
      if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchend', endDrag);

    function render() {
      gl.clearColor(0.0, 0.0, 0.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.disable(gl.DEPTH_TEST);

      const aspect = canvas.width / canvas.height;
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

      const matrix = new Float32Array([
        cosY / aspect, sinX * sinY / aspect, -cosX * sinY / aspect, 0,
        0, cosX, sinX, 0,
        sinY / aspect, -sinX * cosY / aspect, cosX * cosY / aspect, 0,
        0, 0, 0, 1
      ]);

      gl.uniformMatrix4fv(uMatrixLoc, false, matrix);
      if (loadedPoints > 0) {
        gl.drawArrays(gl.POINTS, 0, loadedPoints);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
